<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predicción de Churn</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Predicción de Churn</h1>

        <p class="descripcion">
            Sistema de predicción de abandono de clientes de telecomunicaciones
            mediante minería de datos.
        </p>

        <form id="formularioChurn">

            <div class="campo">
                <label for="tenure">Tiempo de permanencia (meses)</label>
                <input
                    type="number"
                    id="tenure"
                    min="0"
                    max="100"
                    value="12"
                    required
                >
            </div>

            <div class="campo">
                <label for="monthlyCharges">Cargo mensual</label>
                <input
                    type="number"
                    id="monthlyCharges"
                    step="0.01"
                    min="0"
                    value="70"
                    required
                >
            </div>

            <div class="campo">
                <label for="totalCharges">Cargos totales</label>
                <input
                    type="number"
                    id="totalCharges"
                    step="0.01"
                    min="0"
                    value="840"
                    required
                >
            </div>

            <div class="campo">
                <label for="totalServices">Cantidad de servicios</label>
                <input
                    type="number"
                    id="totalServices"
                    min="0"
                    max="8"
                    value="3"
                    required
                >
            </div>

            <button type="submit">
                Realizar predicción
            </button>

        </form>

        <div id="resultado" class="resultado">
            <h2>Resultado</h2>
            <p id="mensajeResultado">
                Ingrese los datos y presione "Realizar predicción".
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
